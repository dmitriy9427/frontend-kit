<!doctype html>
<html lang="ru">
  <head>
    <!-- Компонент src/components/site-head: meta, title, скрипт темы, main.js -->
    <x-site-head description="Стартовая страница проекта на frontend-kit" />
  </head>
  <body>
    <x-site-header />

    <!-- data-module="reveal" на <main>: все [data-reveal] внутри появляются при прокрутке -->
    <main id="main" data-module="reveal">
      <!-- ═══ Первый экран ═══════════════════════════════════════════════ -->
      <section class="hero">
        <div class="container hero__inner">
          <p class="hero__eyebrow" data-reveal="fade">Шаблон проекта</p>
          <h1 class="hero__title" data-module="split-text">Вёрстка, которая не ломается на проде</h1>
          <p class="lead hero__lead" data-reveal>
            Компоненты, модули, стили и инструменты, собранные из реальных проектов. Замените тексты — и можно
            показывать заказчику.
          </p>
          <div class="cluster">
            <!-- x-button — компонент: класс, data-* и прочие атрибуты переходят на <button> -->
            <x-button size="lg" icon="arrow-right" data-dialog-open="callback" data-module="magnetic" data-reveal>
              Обсудить проект
            </x-button>
            <x-button size="lg" variant="secondary" href="%BASE_URL%ui-kit.html" data-reveal
              >Посмотреть UI-кит</x-button
            >
          </div>
        </div>
      </section>

      <!-- ═══ Бегущая строка: список из массива прямо в разметке ═══════════ -->
      <div class="marquee section-marquee" data-module="marquee" data-marquee-speed="50" aria-label="Технологии">
        <ul class="marquee__track" data-marquee-track>
          <li x-for="tech of ['Vite', 'SCSS', 'GSAP', 'Lenis', 'React', 'Vitest', 'a11y']">{{ tech }}</li>
        </ul>
      </div>

      <!-- ═══ Возможности: карточки из src/data/features.json ═════════════ -->
      <section class="section" id="features">
        <div class="container stack" style="--gap: 40px">
          <x-section-head eyebrow="Что внутри" title="Всё для вёрстки под ключ" />
          <ul class="auto-grid features" style="--min: 240px">
            <x-feature-card x-for="f of features" :icon="f.icon" :title="f.title" :text="f.text" />
          </ul>
        </div>
      </section>

      <!-- ═══ Цифры: src/data/stats.json ═════════════════════════════════ -->
      <section class="section stats">
        <div class="container auto-grid" style="--min: 200px">
          <p x-for="s of stats" class="stat">
            <span class="stat__value counter" data-module="counter" :data-counter-suffix="s.suffix">{{ s.value }}</span>
            {{ s.label }}
          </p>
        </div>
      </section>

      <!-- ═══ Калькулятор: компонент со своим JS (price-calc.js) ══════════ -->
      <section class="section" id="price">
        <div class="container stack" style="--gap: 32px">
          <x-section-head
            eyebrow="Компонент с JS"
            title="Сколько стоит сайт"
            text="Подвигайте ползунок: компонент считает сумму, а кнопка открывает модалку другого модуля через ctx.modules."
          />
          <x-price-calc :base="15000" :per-page="4000" />
        </div>
      </section>

      <!-- ═══ Слайдер: слайды из src/data/cases.json ═════════════════════ -->
      <section class="section">
        <div class="container stack" style="--gap: 32px">
          <x-section-head title="Кейсы" />
          <div class="slider cases" data-module="slider" aria-label="Кейсы">
            <div class="slider__track" data-slider-track>
              <article x-for="c of cases" class="slider__slide case">
                <h3 class="h4">{{ c.title }}</h3>
                <p class="muted">{{ c.text }}</p>
              </article>
            </div>
            <div class="slider__nav">
              <button class="slider__arrow" data-slider-prev aria-label="Назад">←</button>
              <div class="slider__dots" data-slider-dots></div>
              <button class="slider__arrow" data-slider-next aria-label="Вперёд">→</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ═══ FAQ: компонент x-faq поверх модуля accordion, данные — faq.json ═ -->
      <section class="section" id="faq">
        <div class="container stack" style="--gap: 32px; max-width: 860px">
          <x-section-head eyebrow="FAQ" title="Вопросы" />
          <x-faq :items="faq" />
        </div>
      </section>
    </main>

    <x-site-footer />
  </body>
</html>
