<!--
  Общая часть <head> всех страниц.
    <head><x-site-head title="О нас" description="…" /></head>
  Без title/description берутся site.title / site.description из src/data/site.json.
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ title ? title + ' — ' + site.title : site.title }}</title>
<meta name="description" content="{{ description ?? site.description }}" />
<meta property="og:title" content="{{ title ?? site.title }}" />
<meta property="og:description" content="{{ description ?? site.description }}" />
<meta name="theme-color" content="#3b5bff" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!--
  Два крошечных скрипта ДО отрисовки страницы:
  1) класс .js — CSS прячет элементы до анимации появления только при включённом JS;
  2) сохранённая тема — без «вспышки» светлой темы при тёмной (kit/js/modules/theme-switch).
-->
<script>
  document.documentElement.classList.add('js')
  try {
    var t = JSON.parse(localStorage.getItem('theme'))
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
  } catch (e) {}
</script>
<script type="module" src="/src/main.js"></script>
