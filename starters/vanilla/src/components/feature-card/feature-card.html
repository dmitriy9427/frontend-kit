<!--
  Карточка преимущества. Обычно выводится циклом из данных:
    <x-feature-card x-for="f of features" :icon="f.icon" :title="f.title" :text="f.text" />
-->
<li class="feature-card" data-reveal>
  <span class="feature-card__icon"><x-icon :name="icon" /></span>
  <h3 class="feature-card__title h4">{{ title }}</h3>
  <p class="muted">{{ text }}</p>
  <slot />
</li>
