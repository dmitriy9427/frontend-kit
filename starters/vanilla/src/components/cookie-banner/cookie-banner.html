<!--
  Баннер согласия на cookies (модуль cookie-consent). Стоит в подвале — значит, на всех страницах.
    <x-cookie-banner />
    <x-cookie-banner version="2" endpoint="/api/consent" />
  version — версия политики: поменяли политику → поменяйте версию, баннер спросит снова.
  endpoint — куда отправляется выбор (и согласие, и отказ); в dev отвечает мок mocks/consent.js.

  Тексты — ключи kit.cookies.* (kit/js/i18n): на английской странице баннер сам станет английским.
  Свой текст: addMessages('ru', { kit: { cookies: { text: '…' } } }) или просто перепишите разметку.
  Категории — чекбоксы data-cookie-toggle: уберите лишнюю или добавьте свою, JS править не нужно.
  Вид — переменные --cookie-* (kit/scss/components/_cookie.scss).
  Изменить выбор позже — любая кнопка с data-cookie-open (в подвале есть).
-->
<section
  class="cookie"
  data-module="cookie-consent"
  :data-cookie-consent-version="version ?? '1'"
  :data-cookie-consent-endpoint="endpoint ?? '/api/consent'"
  aria-label="Файлы cookie"
  data-i18n-attr="aria-label:kit.cookies.label"
  hidden
>
  <p class="cookie__text">
    <span data-i18n="kit.cookies.text">Мы используем cookie, чтобы сайт работал и становился удобнее.</span>
    <a href="%BASE_URL%privacy.html" data-i18n="kit.cookies.more">Подробнее</a>
  </p>
  <div class="cookie__panel" data-cookie-panel hidden>
    <label class="cookie__option">
      <input type="checkbox" data-cookie-toggle="necessary" checked disabled />
      <span class="cookie__option-title" data-i18n="kit.cookies.necessary">Необходимые</span>
      <span class="cookie__option-hint" data-i18n="kit.cookies.necessaryHint">
        Без них сайт не работает: вход, корзина, сам этот выбор.
      </span>
    </label>
    <label class="cookie__option">
      <input type="checkbox" data-cookie-toggle="analytics" />
      <span class="cookie__option-title" data-i18n="kit.cookies.analytics">Аналитика</span>
      <span class="cookie__option-hint" data-i18n="kit.cookies.analyticsHint">
        Помогают понять, какие страницы полезны, а какие нет.
      </span>
    </label>
    <label class="cookie__option">
      <input type="checkbox" data-cookie-toggle="marketing" />
      <span class="cookie__option-title" data-i18n="kit.cookies.marketing">Реклама</span>
      <span class="cookie__option-hint" data-i18n="kit.cookies.marketingHint">
        Показывают рекламу, которая вам ближе.
      </span>
    </label>
    <button class="btn btn--secondary btn--sm" type="button" data-cookie-save data-i18n="kit.cookies.save">
      Сохранить выбор
    </button>
  </div>
  <div class="cookie__actions">
    <button class="btn btn--sm" type="button" data-cookie-accept data-i18n="kit.cookies.accept">Принять все</button>
    <button class="btn btn--secondary btn--sm" type="button" data-cookie-reject data-i18n="kit.cookies.reject">
      Только необходимые
    </button>
    <button class="btn btn--ghost btn--sm" type="button" data-cookie-settings data-i18n="kit.cookies.settings">
      Настроить
    </button>
  </div>
</section>
