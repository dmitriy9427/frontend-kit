<!--
  Шапка. Пункты меню — из src/data/site.json (site.nav).
  Активный пункт подсвечивается сам: ссылке на текущую страницу плагин
  ставит aria-current="page" (стили — [aria-current='page']).
-->
<a class="skip-link" href="#main">Перейти к содержимому</a>
<header class="header" data-module="sticky-header">
  <div class="header__inner">
    <a class="logo" href="%BASE_URL%">Логотип</a>
    <nav id="site-menu" class="nav mobile-menu" aria-label="Основное меню" data-lenis-prevent>
      <ul class="nav__list">
        <li x-for="link of site.nav"><a class="nav__link" href="%BASE_URL%{{ link.href }}">{{ link.label }}</a></li>
      </ul>
    </nav>
    <div class="header__actions">
      <button class="theme-switch" data-module="theme-switch" aria-label="Тёмная тема" data-tooltip></button>
      <button class="btn btn--sm header__cta" data-dialog-open="callback">Связаться</button>
      <button class="burger" data-module="menu" data-menu-target="site-menu" aria-label="Открыть меню">
        <span class="burger__lines"></span>
      </button>
    </div>
  </div>
</header>
